# HyperSpot conda env for the Docker image (docker/README.md). Only what the hyperspot package uses,
# pinned to the versions of the env that produced the current results (2026-11-27); mamba fills in the rest.
# torch 2.6.0 + CUDA 12.4 wheels: the host GPU driver must support CUDA 12.4 (550 tested).
name: HyperSpot
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.0
  - pip
  # imported by the package (every CLI command loads these)
  - numpy=2.3.5
  - pandas=2.3.3
  - scipy=1.16.3
  - scikit-learn=1.8.0
  - scikit-image=0.26.0
  - pillow=12.1.0
  - matplotlib=3.10.8
  - joblib=1.5.3
  - threadpoolctl=3.5.0
  - tqdm=4.67.1
  - h5py=3.15.1
  - anndata=0.12.0
  - scanpy=1.11.5
  - squidpy=1.7.0
  - einops=0.8.1
  - cyclopts=4.4.6
  # loaded by scanpy at run time: igraph (sc.tl.leiden flavor="igraph"), umap-learn/pynndescent/numba
  # (sc.pp.neighbors method="umap"), pybiomart (sc.queries.biomart_annotations, preprocessing)
  - python-igraph=1.0.0
  - umap-learn=0.5.11
  - pynndescent=0.5.13
  - numba=0.63.1
  - pybiomart=0.2.0
  # imported inside downstream functions of pipeline/evaluation.py
  - leidenalg=0.11.0
  - networkx=3.6.1
  - statsmodels=0.14.6
  - mlxtend=0.25.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      # loaded by scanpy at run time: sc.queries.enrich (g:Profiler, pipeline/selection.py)
      - gprofiler-official==1.0.0
